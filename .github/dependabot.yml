version: 2
updates:
  # Production npm dependencies — surfaced in CHANGELOG as `fix(deps)`
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    assignees:
      - "emaarco"
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
    open-pull-requests-limit: 2

  # Development npm dependencies — hidden from CHANGELOG as `chore(deps-dev)`
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    assignees:
      - "emaarco"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
    open-pull-requests-limit: 2

  # GitHub Actions — hidden from CHANGELOG as `chore(deps)`
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    assignees:
      - "emaarco"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
    open-pull-requests-limit: 2
